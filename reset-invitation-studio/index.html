<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="为知乎科技 2026 年终圆桌组合、编辑和复制邀请话术。">
  <title>Reset 邀请话术工作台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #18233b;
      background: #f6f8fa;
      --muted: #596781;
      --border: #dfe5ed;
      --accent: #2f51cc;
      --accent-light: #edf2ff;
      --white: #fff;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-width: 18rem;
      min-height: 100vh;
      margin: 0;
      background: #f6f8fa;
    }

    h1, h2, h3, p { margin: 0; }

    button, select, textarea { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }

    button:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .workspace {
      max-width: 88rem;
      margin-inline: auto;
      padding: clamp(1.125rem, 2.1vw, 1.875rem) clamp(1rem, 3.5vw, 3rem) 1.75rem;
    }

    .event-name {
      margin-bottom: 0.4rem;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(1.65rem, 2.6vw, 2.1rem);
      font-weight: 750;
      line-height: 1.16;
      letter-spacing: -0.045em;
    }

    h1 span { color: var(--accent); }

    .presets { margin-block: 1.25rem 1rem; }

    .preset-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.625rem;
    }

    .presets h2 { font-size: 0.9375rem; }

    .batch-help {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .batch-picker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .batch-picker select {
      min-height: 2.125rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      background: var(--white);
      color: #18233b;
      cursor: pointer;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.625rem;
    }

    .preset {
      min-height: 4.125rem;
      padding: 0.625rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--white);
      text-align: left;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .preset:hover:not(:disabled) { border-color: #9aaddf; }
    .preset:disabled { background: #f9fafb; }
    .preset:disabled .preset-name { color: var(--muted); }

    .preset[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .preset-name {
      display: block;
      font-size: 0.9625rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .preset-channel {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1.4;
    }

    .studio {
      display: grid;
      grid-template-columns: minmax(20rem, 0.9fr) minmax(0, 1.65fr);
      gap: 1rem;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: clamp(31rem, calc(100dvh - 16rem), 49rem);
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--white);
    }

    .panel-header { padding: 0.9rem 1.1rem 0.75rem; }

    .panel-header h2 {
      font-size: 1.125rem;
      line-height: 1.4;
      letter-spacing: -0.015em;
    }

    .panel-header p {
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .module-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      padding: 0 1.1rem 0.65rem;
      border-bottom: 1px solid #edf0f6;
    }

    .filter, .editor-action {
      min-height: 2.125rem;
      padding: 0.3rem 0.625rem;
      border: 1px solid transparent;
      border-radius: 0.45rem;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 600;
    }

    .filter { padding-inline: 0.425rem; }
    .filter:hover, .editor-action:hover:not(:disabled) { background: #f2f5fb; }

    .filter[aria-pressed="true"] {
      background: var(--accent-light);
      color: var(--accent);
    }

    .module-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
      padding: 0.75rem 0.75rem 1rem 1.1rem;
    }

    .module-list[data-view="all"] .module-group + .module-group { margin-top: 1.1rem; }
    .module-list:not([data-view="all"]) .module-group h3 { display: none; }

    .module-group h3 {
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 700;
    }

    .module-card {
      display: grid;
      grid-template-columns: 0.75rem minmax(0, 1fr) 2rem;
      align-items: start;
      gap: 0.625rem;
      padding: 0.625rem;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      background: var(--white);
      cursor: grab;
    }

    .module-card + .module-card { margin-top: 0.375rem; }
    .module-card:hover { border-color: #aebadf; }
    .standalone-module { grid-template-columns: 0.75rem minmax(0, 1fr) auto; }
    .module-card.is-dragging { opacity: 0.55; cursor: grabbing; }

    .grip {
      width: 0.75rem;
      height: 1.125rem;
      margin-top: 0.38rem;
      background: radial-gradient(circle, #8493b0 1px, transparent 1.6px) 0 0 / 0.375rem 0.375rem;
    }

    .module-card summary {
      position: relative;
      padding-right: 0.875rem;
      list-style: none;
      cursor: pointer;
    }

    .module-card summary::-webkit-details-marker { display: none; }

    .module-card summary::after {
      position: absolute;
      top: 0.37rem;
      right: 0.15rem;
      width: 0.4rem;
      height: 0.4rem;
      border: solid #687894;
      border-width: 0 1.5px 1.5px 0;
      content: "";
      transform: rotate(45deg);
    }

    .module-card details[open] summary::after { transform: translateY(0.15rem) rotate(225deg); }

    .module-title {
      display: block;
      font-size: 0.875rem;
      font-weight: 700;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .module-snippet, .module-note {
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .module-snippet {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-card details[open] .module-snippet { display: none; }

    .module-note { margin-top: 0.35rem; }

    .group-note {
      margin-bottom: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      padding: 0.5rem 0.65rem;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .group-note summary { cursor: pointer; font-weight: 600; }
    .group-note p { margin-top: 0.35rem; }

    .module-reminder, .draft-reminder {
      padding: 0.55rem 0.7rem;
      border: 1px solid #efd9ab;
      border-radius: 0.5rem;
      background: #fff8e9;
      color: #72450e;
      font-size: 0.875rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .module-reminder { margin-top: 0.4rem; }
    .draft-reminder { margin: 0 1.1rem 0.625rem; }

    .module-text {
      margin-top: 0.4rem;
      font-size: 1rem;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      cursor: text;
    }

    .add-button {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid #d8e2fc;
      border-radius: 0.45rem;
      background: var(--white);
      color: var(--accent);
      font-size: 1.25rem;
      line-height: 1;
    }

    .standalone-module .add-button {
      width: auto;
      padding-inline: 0.55rem;
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .add-button:hover { background: var(--accent-light); }

    .compose-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .editor-actions { display: flex; gap: 0.25rem; }
    .editor-action:disabled { color: #8994aa; }

    .editor-frame {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      margin: 0 1.1rem;
      border: 1px solid #d7e0f0;
      border-radius: 0.75rem;
      background: #fcfdff;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .editor-frame:focus-within, .editor-frame.is-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px #e2eaff;
    }

    .editor-frame.can-drop { border-color: var(--accent); border-style: dashed; }
    .editor-frame.is-over { background: var(--accent-light); }

    .drop-hint {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      display: none;
      padding: 0.45rem 0.65rem;
      border-radius: 0.45rem;
      background: var(--accent);
      color: var(--white);
      font-size: 0.875rem;
      font-weight: 600;
      pointer-events: none;
    }

    .editor-frame.is-over .drop-hint { display: block; }

    textarea {
      display: block;
      flex: 1;
      min-width: 0;
      min-height: 0;
      padding: clamp(0.9rem, 2vw, 1.375rem);
      resize: none;
      border: 0;
      border-radius: inherit;
      outline: none;
      background: transparent;
      font-size: 1rem;
      line-height: 1.85;
    }

    textarea::placeholder { color: #687691; }

    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1.1rem 0.9rem;
    }

    .feedback { color: #38558f; font-size: 0.875rem; line-height: 1.45; }

    .copy-button {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 2.75rem;
      padding: 0.55rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.6rem;
      background: var(--accent);
      color: var(--white);
      font-size: 0.9375rem;
      font-weight: 700;
    }

    .copy-button:hover:not(:disabled) { background: #233fa8; }
    .copy-button:disabled { background: #e6ecfa; color: #586a96; }

    .copy-icon {
      position: relative;
      display: block;
      width: 0.95rem;
      height: 1rem;
    }

    .copy-icon::before, .copy-icon::after {
      position: absolute;
      width: 0.63rem;
      height: 0.73rem;
      border: 1.5px solid currentColor;
      border-radius: 0.13rem;
      content: "";
    }

    .copy-icon::before { top: 0; left: 0; border-right-color: transparent; border-bottom-color: transparent; }
    .copy-icon::after { right: 0; bottom: 0; }

    @media (max-width: 56rem) {
      .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .studio { grid-template-columns: minmax(0, 1fr); }
      .panel { height: auto; }
      .module-list { max-height: 18rem; }
      .compose-panel { height: 32rem; }
    }

    @media (max-width: 29rem) {
      .workspace { padding-inline: 0.75rem; }
      .preset { padding-inline: 0.65rem; }
      .preset-name { font-size: 0.875rem; }
      .panel-header, .module-filters, .editor-footer { padding-inline: 0.85rem; }
      .module-list { padding-left: 0.85rem; }
      .editor-frame, .draft-reminder { margin-inline: 0.85rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <header>
      <p class="event-name">知乎科技 · 2026 年终圆桌</p>
      <h1><span>Reset</span> 邀请话术工作台</h1>
    </header>

    <section class="presets" aria-labelledby="presets-title">
      <div class="preset-header">
        <h2 id="presets-title">按人群套用</h2>
        <label class="batch-picker">
          邀约阶段
          <select id="release-batch" aria-describedby="batch-help">
            <option value="first" selected>首批邀请</option>
            <option value="live">上线后知会</option>
            <option value="second">第二批邀请</option>
          </select>
        </label>
      </div>
      <div class="preset-grid" id="presets"></div>
      <p class="batch-help" id="batch-help" hidden></p>
    </section>

    <div class="studio">
      <section class="panel" aria-labelledby="modules-title">
        <header class="panel-header">
          <h2 id="modules-title">文字模块</h2>
          <p>拖入或点「＋」追加。点「填入」加载单条跟进话术。</p>
        </header>
        <div class="module-filters" role="group" aria-label="筛选文字模块">
          <button class="filter" type="button" data-filter="opening" aria-pressed="false">开头</button>
          <button class="filter" type="button" data-filter="body" aria-pressed="true">正文</button>
          <button class="filter" type="button" data-filter="ending" aria-pressed="false">结尾</button>
          <button class="filter" type="button" data-filter="followup" aria-pressed="false">问题同步</button>
          <button class="filter" type="button" data-filter="poster" aria-pressed="false">海报沟通</button>
          <button class="filter" type="button" data-filter="all" aria-pressed="false">全部</button>
        </div>
        <div class="module-list" id="module-list" data-view="body"></div>
      </section>

      <section class="panel compose-panel" id="compose-panel" aria-labelledby="compose-title">
        <header class="panel-header compose-header">
          <h2 id="compose-title">写作框</h2>
          <div class="editor-actions">
            <button class="editor-action" id="undo" type="button" disabled>撤销</button>
            <button class="editor-action" id="clear" type="button" disabled>清空</button>
          </div>
        </header>
        <p class="draft-reminder" id="draft-reminder" role="note" hidden></p>
        <div class="editor-frame" id="editor-frame">
          <textarea id="editor" aria-label="邀请话术正文" placeholder="选择上方的人群，或把左侧的文字拖到这里。" spellcheck="false"></textarea>
          <span class="drop-hint" aria-hidden="true">松开后追加文字</span>
        </div>
        <footer class="editor-footer">
          <p class="feedback" id="feedback" role="status"></p>
          <button class="copy-button" id="copy" type="button" disabled>
            <span class="copy-icon" aria-hidden="true"></span>
            一键复制
          </button>
        </footer>
      </section>
    </div>
  </main>

  <template id="module-card-template">
    <article class="module-card" draggable="true">
      <span class="grip" aria-hidden="true"></span>
      <details>
        <summary>
          <span class="module-title"></span>
          <span class="module-snippet"></span>
        </summary>
        <p class="module-note" hidden></p>
        <p class="module-reminder" role="note" hidden></p>
        <p class="module-text"></p>
      </details>
      <button class="add-button" type="button">＋</button>
    </article>
  </template>

  <script>
    const moduleGroups = [
      { id: 'opening', title: '开头' },
      { id: 'body', title: '正文' },
      { id: 'ending', title: '结尾' },
      { id: 'followup', title: '问题同步', standalone: true },
      { id: 'poster', title: '海报沟通', standalone: true, note: '提前批嘉宾（这里是白包子猫理解提前批嘉宾一般是嘉宾里较为大牌的了，后续如果有后几批嘉宾也同样值得做海报，也可以用相同的话术）同意参加后，请各条线的负责人根据嘉宾的重要程度沟通收集信息制作开屏海报。' },
    ];

    const followupGreeting = '老师您好，本次圆桌活动的主推问题已经上线，欢迎您来回答：';
    const questionTracks = [
      {
        id: 'developers', title: '开发者',
        questions: [
          '开发者：作为开发者，AI Coding 给你带来了哪些前所未有的经历？',
          '从「古法编程」走到 AI 时代，你对程序员这份工作的认识发生了哪些变化？',
        ],
      },
      {
        id: 'embodied', title: '具身智能',
        questions: [
          '作为一名科技从业者，如何总结你的 2026？',
          '2026年，具身真的走向智能了吗？',
        ],
      },
      {
        id: 'models', title: '大模型',
        questions: [
          '作为一名科技从业者，如何总结你的 2026？',
          '2026 年，大模型是不是发展到头了？还能再发展吗？',
          '回看年初，Agent 的哪些变化超出了你的预期？明年发展速度会更快吗？',
        ],
      },
      {
        id: 'researchers', title: '研究者',
        questions: [
          '作为一名科技从业者，如何总结你的 2026？',
          '不看论文数量，你觉得自己今年最大的成长是什么？',
        ],
      },
    ];
    const questionSections = questionTracks.map(track =>
      ['【' + track.title + '】', ...track.questions.map(question => '· ' + question)].join('\n')
    );
    const questionReminder = '发送前补上对应的问题链接。';

    const modules = [
      {
        id: 'opening-a', group: 'opening', title: '开头 A｜重要 + 陌生大咖',
        text: 'XX 老师您好，我是知乎科技的 XX，冒昧打扰。之前关注过您在 XX 方向的工作，2026年收官之际，知乎科技即将举办年终线上圆桌活动，想诚挚邀请您参与。',
      },
      {
        id: 'opening-b', group: 'opening', title: '开头 B｜重要 + 熟悉大咖/大V',
        text: 'XX 老师您好，年底将至，知乎科技这边正在筹备今年的年终线上圆桌，想诚挚邀请您参与。',
      },
      {
        id: 'opening-c', group: 'opening', title: '开头 C｜一般重要 + 不熟悉答主',
        text: 'XX 老师您好，我是知乎科技的 XX，一直关注您在站内的专业分享。年底将至，知乎科技推出了 2026 年终圆桌策划，想来邀请您参与。',
      },
      {
        id: 'opening-d', group: 'opening', title: '开头 D｜一般重要 + 熟悉答主',
        text: 'XX 好！知乎科技今年的年终圆桌马上启动了，来问问你今年有没有兴趣一起参与。',
      },
      {
        id: 'body-1', group: 'body', title: '正文 1｜长版 · 首批',
        note: '（适用于重要的人）（圆桌问题上线后会更新新的话术）',
        text: `本次的圆桌是「Reset」，希望邀请一线研究者和从业者，共同回顾这一年的经历与判断。去年的年终策划累计产生了 12w+ 互动、1000w+ 全网曝光。
为了不占用您太多时间，核心信息整理如下：
活动时间：2026 年 12 月 8 日 起
可参考的讨论方向：
· 个人感受：总结你的 2026，聊聊这一年的真实体感与关键选择；
· 行业变化：分享您这一年对 AI 行业「潮起潮落」的观察与思考；
· 专业判断：聊聊您对当下格局变化中的取舍和思考。
参与方式：
待相关问题正式上线，我们会第一时间给您发送链接，届时您可以挑选最感兴趣的重点问题作答（篇幅不限，我们也可以协助您敲定选题、梳理结构）。
此外，也欢迎提出一个您认为值得行业继续探讨的新问题，我们也会针对您提出的优质问题进行重点运营。
您将获得的平台支持：圆桌主页嘉宾席、精选至年度专题、官方账号及外媒矩阵的强力传播，以及站内专属流量扶持。`,
      },
      {
        id: 'body-2', group: 'body', title: '正文 2｜上线后知会 轻量版',
        text: `本次年终圆桌主题为「Reset」（时间：12 月 8 日起），围绕个人感受、行业变化、专业判断三个方向，邀请科技从业者一起复盘 2026。
参与方式很灵活，您可以挑选圆桌里感兴趣的问题作答，或者自己发起新问题都可以（篇幅不限）。优质内容会获得圆桌首页露出、官方流量扶持、超赞包奖励，以及知乎官号和外部矩阵的传播推荐。`,
      },
      {
        id: 'ending-pdf-first', group: 'ending', title: '结尾 1｜配PDF · 首批',
        note: '（重要的人）',
        reminder: '❗需要在问题提出之后回溯发出邀请的人，同步问题链接',
        text: `完整的邀请函和往期参考放在附件 PDF 里了，供您参考。如果您提前有了灵感，也可以先按自己的节奏准备内容；正式的问题链接会在圆桌上线后第一时间同步给您，届时直接发布即可。

为了赶上我们第一波的集中宣发排期，如果您有兴趣参与，希望尽量能在 12 月 14 日前完成发布；发布后把回答链接同步给我就好，我这边好及时为您安排圆桌收录、流量扶持和相关资源推介。`,
      },
      {
        id: 'ending-pdf-second', group: 'ending', title: '结尾 1｜配PDF · 第二批',
        note: '（重要的人）',
        text: `完整的邀请函和往期参考放在附件 PDF 里了，供您参考。
如果您有兴趣参与，希望尽量能在 12 月 21日前完成发布；发布后把链接同步给我就好，我这边好及时为您安排圆桌收录、流量扶持和相关资源推介等。`,
      },
      {
        id: 'ending-roundtable-live', group: 'ending', title: '结尾2｜上线后知会 不重要的人',
        reminder: '发送前补上圆桌链接。',
        text: '具体的问题列表直接看圆桌页就行：[圆桌链接]。有想聊的题尽量在 12 月 18号前发出来哈～发完记得把链接发我，我好第一时间帮你安排圆桌收录、流量扶持和相关资源推介哦',
      },
      {
        id: 'followup-all', group: 'followup', title: '主推问题｜全部方向',
        note: '问题上线后同步相关链接',
        reminder: questionReminder,
        text: [followupGreeting, ...questionSections].join('\n\n'),
      },
      ...questionTracks.map((track, index) => ({
        id: 'followup-' + track.id,
        group: 'followup',
        title: '主推问题｜' + track.title,
        reminder: questionReminder,
        preview: track.questions[0],
        text: [followupGreeting, questionSections[index]].join('\n\n'),
      })),
      {
        id: 'poster-consent', group: 'poster', title: '海报沟通｜询问授权',
        text: '活动期间我们想为您定制一张专属的活动开屏海报，届时开屏海报也会跳转到您的相关回答上，为您的回答带来曝光~不知道您这边是否方便授权支持？',
      },
      {
        id: 'poster-details', group: 'poster', title: '海报沟通｜收集信息',
        note: '（如同意）',
        text: `好嘞，感谢老师支持！麻烦您有空时发我以下几项信息，我这边同步给设计同学制作，成稿后会第一时间发您确认：

· 署名方式：姓名 / 常用昵称
· 头衔 / 简介：用于海报展示的职务或身份介绍
· 所属机构：机构名称（选填）
· 个人照片：1 张清晰、可公开使用的个人照（半身或正脸尤佳）`,
      },
    ];

    const presets = [
      { name: '陌生的/时间紧迫的大咖', audience: 'important', opening: 'opening-a' },
      { name: '比较熟悉的大咖/ 影响力较大的答主', audience: 'important', opening: 'opening-b' },
      { name: '一般重要的答主，但不熟悉', audience: 'general', opening: 'opening-c' },
      { name: '一般重要的答主，但熟悉', audience: 'general', opening: 'opening-d' },
    ];

    const batchTemplates = {
      first: {
        important: { modules: ['body-1', 'ending-pdf-first'], channel: '文字介绍 + PDF' },
      },
      live: {
        important: { modules: ['followup-all'], channel: '同步主推问题', standalone: true },
        general: { modules: ['body-2', 'ending-roundtable-live'], channel: '文字介绍+圆桌页面' },
      },
      second: {
        important: { modules: ['body-2', 'ending-pdf-second'], channel: '文字介绍 + PDF' },
      },
    };

    const batchHelpText = {
      first: '一般答主的话术在「上线后知会」。',
      second: '第二批暂用轻量版正文，长版待更新。',
    };

    const editor = document.getElementById('editor');
    const editorFrame = document.getElementById('editor-frame');
    const composePanel = document.getElementById('compose-panel');
    const presetList = document.getElementById('presets');
    const releaseBatch = document.getElementById('release-batch');
    const batchHelp = document.getElementById('batch-help');
    const draftReminder = document.getElementById('draft-reminder');
    const moduleList = document.getElementById('module-list');
    const cardTemplate = document.getElementById('module-card-template');
    const undoButton = document.getElementById('undo');
    const clearButton = document.getElementById('clear');
    const copyButton = document.getElementById('copy');
    const feedback = document.getElementById('feedback');
    const modulesById = new Map(modules.map(module => [module.id, module]));
    const batches = Array.from(releaseBatch.options, option => option.value);
    let selectedBatch = releaseBatch.value;
    let activePreset = null;
    let activeReminder = '';
    let previousDraft = null;
    let draggedModule = null;

    function updateControls(message = '') {
      for (const button of presetList.children) {
        const index = Number(button.dataset.preset);
        const template = batchTemplates[selectedBatch][presets[index].audience];
        button.setAttribute('aria-pressed', String(index === activePreset));
        button.disabled = !template;
        button.querySelector('.preset-channel').textContent = template?.channel ?? '上线后知会';
      }
      batchHelp.textContent = batchHelpText[selectedBatch] ?? '';
      batchHelp.hidden = !batchHelp.textContent;
      draftReminder.textContent = activeReminder;
      draftReminder.hidden = !activeReminder;
      undoButton.disabled = previousDraft === null;
      clearButton.disabled = editor.value.length === 0;
      copyButton.disabled = editor.value.length === 0;
      feedback.textContent = message;
    }

    function changeDraft(text, preset, message, { reminder = activeReminder, batchToRestore = null } = {}) {
      if (editor.value !== text || activePreset !== preset || activeReminder !== reminder) {
        previousDraft = {
          text: editor.value,
          preset: activePreset,
          reminder: activeReminder,
          batch: batchToRestore,
        };
        editor.value = text;
        activePreset = preset;
        activeReminder = reminder;
      }
      updateControls(message);
    }

    function appendModule(module) {
      let separator = '';
      if (editor.value && !editor.value.endsWith('\n\n')) {
        separator = editor.value.endsWith('\n') ? '\n' : '\n\n';
      }
      const reminder = module.reminder ?? (module.group === 'ending' ? '' : activeReminder);
      changeDraft(editor.value + separator + module.text, activePreset, '已追加' + module.title.split('｜')[0], { reminder });
      editor.setSelectionRange(editor.value.length, editor.value.length);
      editor.scrollTop = editor.scrollHeight;
    }

    function getPresetDraft(preset, batch) {
      const template = batchTemplates[batch][preset.audience];
      if (!template) return null;

      const ids = template.standalone ? template.modules : [preset.opening, ...template.modules];
      const parts = ids.map(id => modulesById.get(id));
      return {
        text: parts.map(module => module.text).join('\n\n'),
        reminder: parts.find(module => module.reminder)?.reminder ?? '',
      };
    }

    function fillDraft(draft, preset = null) {
      changeDraft(draft.text, preset, '已填入话术', { reminder: draft.reminder ?? '' });
      editor.setSelectionRange(0, 0);
      editor.scrollTop = 0;
      if (window.matchMedia('(max-width: 56rem)').matches) {
        composePanel.scrollIntoView({ block: 'start' });
      }
    }

    function selectPreset(index) {
      const draft = getPresetDraft(presets[index], selectedBatch);
      if (draft) fillDraft(draft, index);
    }

    releaseBatch.addEventListener('change', () => {
      const previousBatch = selectedBatch;
      selectedBatch = releaseBatch.value;
      const preset = presets[activePreset];
      const nextDraft = preset ? getPresetDraft(preset, selectedBatch) : null;
      if (!nextDraft) {
        updateControls();
        return;
      }

      const matchesPreset = batches.some(batch => editor.value === getPresetDraft(preset, batch)?.text);
      if (!matchesPreset) {
        updateControls('点选人群可套用所选批次');
        return;
      }

      changeDraft(nextDraft.text, activePreset, '已切换邀约阶段', {
        reminder: nextDraft.reminder,
        batchToRestore: previousBatch,
      });
    });

    presets.forEach((preset, index) => {
      const button = document.createElement('button');
      const name = document.createElement('span');
      const channel = document.createElement('span');
      button.className = 'preset';
      button.type = 'button';
      button.dataset.preset = index;
      button.setAttribute('aria-pressed', 'false');
      name.className = 'preset-name';
      name.textContent = preset.name;
      channel.className = 'preset-channel';
      button.append(name, channel);
      button.addEventListener('click', () => selectPreset(index));
      presetList.append(button);
    });
    updateControls();

    for (const group of moduleGroups) {
      const section = document.createElement('section');
      const heading = document.createElement('h3');
      section.className = 'module-group';
      section.dataset.group = group.id;
      section.hidden = moduleList.dataset.view !== 'all' && moduleList.dataset.view !== group.id;
      heading.textContent = group.title;
      section.append(heading);

      if (group.note) {
        const notice = document.createElement('details');
        const label = document.createElement('summary');
        const content = document.createElement('p');
        notice.className = 'group-note';
        label.textContent = '开屏海报制作说明';
        content.textContent = group.note;
        notice.append(label, content);
        section.append(notice);
      }

      for (const module of modules.filter(item => item.group === group.id)) {
        const card = cardTemplate.content.firstElementChild.cloneNode(true);
        const note = card.querySelector('.module-note');
        const addButton = card.querySelector('.add-button');
        card.querySelector('.module-title').textContent = module.title;
        card.querySelector('.module-snippet').textContent = module.note ?? module.preview ?? module.text.split('\n')[0];
        card.querySelector('.module-text').textContent = module.text;
        if (module.note) {
          note.textContent = module.note;
          note.hidden = false;
        }
        if (module.reminder) {
          const reminder = card.querySelector('.module-reminder');
          reminder.textContent = module.reminder;
          reminder.hidden = false;
        }
        if (group.standalone) {
          card.classList.add('standalone-module');
          addButton.textContent = '填入';
          addButton.setAttribute('aria-label', '填入' + module.title);
          addButton.title = '单独填入写作框';
          addButton.addEventListener('click', () => fillDraft(module));
        } else {
          addButton.setAttribute('aria-label', '追加' + module.title);
          addButton.title = '追加到写作框';
          addButton.addEventListener('click', () => appendModule(module));
        }
        card.addEventListener('dragstart', event => {
          if (event.target !== card) return;
          draggedModule = module;
          event.dataTransfer.effectAllowed = 'copy';
          event.dataTransfer.setData('text/plain', module.text);
          card.classList.add('is-dragging');
          editorFrame.classList.add('can-drop');
        });
        card.addEventListener('dragend', () => {
          draggedModule = null;
          card.classList.remove('is-dragging');
          editorFrame.classList.remove('can-drop', 'is-over');
        });
        section.append(card);
      }
      moduleList.append(section);
    }

    const filters = document.querySelectorAll('[data-filter]');
    for (const filter of filters) {
      filter.addEventListener('click', () => {
        moduleList.dataset.view = filter.dataset.filter;
        for (const button of filters) {
          button.setAttribute('aria-pressed', String(button === filter));
        }
        for (const group of moduleList.children) {
          group.hidden = moduleList.dataset.view !== 'all' && group.dataset.group !== moduleList.dataset.view;
        }
        moduleList.scrollTop = 0;
      });
    }

    editorFrame.addEventListener('dragover', event => {
      if (!draggedModule) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      editorFrame.classList.add('is-over');
    });

    editorFrame.addEventListener('dragleave', event => {
      if (!editorFrame.contains(event.relatedTarget)) editorFrame.classList.remove('is-over');
    });

    editorFrame.addEventListener('drop', event => {
      if (!draggedModule) return;
      event.preventDefault();
      editorFrame.classList.remove('is-over');
      editor.focus({ preventScroll: true });
      appendModule(draggedModule);
    });

    editor.addEventListener('input', () => {
      previousDraft = null;
      if (!editor.value) {
        activePreset = null;
        activeReminder = '';
      }
      updateControls();
    });

    clearButton.addEventListener('click', () => {
      changeDraft('', null, '已清空写作框', { reminder: '' });
      editor.focus({ preventScroll: true });
    });

    undoButton.addEventListener('click', () => {
      if (!previousDraft) return;
      editor.value = previousDraft.text;
      activePreset = previousDraft.preset;
      activeReminder = previousDraft.reminder;
      if (previousDraft.batch) {
        selectedBatch = previousDraft.batch;
        releaseBatch.value = selectedBatch;
      }
      previousDraft = null;
      updateControls('已恢复上一版话术');
      editor.focus({ preventScroll: true });
    });

    copyButton.addEventListener('click', async () => {
      const text = editor.value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        feedback.textContent = '已复制到剪贴板';
      } catch {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.focus({ preventScroll: true });
        editor.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch {}
        if (copied) {
          editor.setSelectionRange(start, end);
          copyButton.focus({ preventScroll: true });
          feedback.textContent = '已复制到剪贴板';
        } else {
          feedback.textContent = '已选中全文，可以手动复制';
        }
      }
    });
  </script>
</body>
</html>
